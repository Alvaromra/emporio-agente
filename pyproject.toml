[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agente"
version = "0.1.0"
description = "Agente de atendimento por mensagens de texto da Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    # Windows não traz a base de fusos horários do sistema; sem isto,
    # ZoneInfo("America/Campo_Grande") falha.
    "tzdata>=2024.1",
    # Leitura do manual de políticas (puro Python, sem dependências do sistema).
    "pypdf>=6.0,<7",
    # Provedores de LLM: Gemini API (padrão) e Ollama (local).
    "google-genai>=2.0,<3",
    "ollama>=0.6,<1",
    # Interface web e API.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
emporio-etl = "emporio.etl.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emporio = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
